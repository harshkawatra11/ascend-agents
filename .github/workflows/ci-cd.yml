name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -e .[dev] 2>/dev/null || pip install -r requirements.txt ruff pytest pytest-cov httpx
      - name: Lint (Ruff)
        run: ruff check app
      - name: Test (Pytest)
        run: pytest --cov=app

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Deploy is manual-gated: requires GCP_PROJECT_ID and GCP_SA_KEY secrets to be
  # configured. The live deployment is currently driven from the CLI instead
