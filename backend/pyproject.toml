[project]
name = "swasthyagrid-backend"
version = "0.1.0"
description = "SwasthyaGrid AI — District Health Operations Center backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-genai>=1.0",
    "google-cloud-firestore>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the rule set explicitly. Relying on Ruff's defaults means a new Ruff
# release can fail CI on code that never changed, which is what happened when
# CI resolved a newer Ruff than the pinned local one.
select = ["E", "F", "W", "I", "B", "UP"]
# B008 forbids function calls in argument defaults, but `Depends(...)` in a
# signature default is FastAPI's documented dependency-injection syntax and
# cannot be written any other way.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
