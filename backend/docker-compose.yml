services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - USE_VERTEX_AI=false
      - USE_SECRET_MANAGER=false
      - ENVIRONMENT=local
    volumes:
      - ./data:/app/data:ro
